<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat & Minigames</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Login Screen -->
    <div id="loginScreen" class="screen active">
        <div class="login-container">
            <h1>Welcome</h1>
            <p>Sign in to access AI Chat & Minigames</p>
            <form id="loginForm">
                <input type="email" id="email" placeholder="Email" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit">Login</button>
                <p class="toggle-text">Don't have an account? <a href="#" onclick="toggleSignup()">Sign up</a></p>
            </form>
        </div>
    </div>

    <!-- Signup Screen -->
    <div id="signupScreen" class="screen">
        <div class="login-container">
            <h1>Create Account</h1>
            <form id="signupForm">
                <input type="text" id="fullname" placeholder="Full Name" required>
                <input type="email" id="signup-email" placeholder="Email" required>
                <input type="password" id="signup-password" placeholder="Password" required>
                <input type="password" id="confirm-password" placeholder="Confirm Password" required>
                <button type="submit">Sign Up</button>
                <p class="toggle-text">Already have an account? <a href="#" onclick="toggleSignup()">Login</a></p>
            </form>
        </div>
    </div>

    <!-- Main App Screen -->
    <div id="mainScreen" class="screen">
        <nav class="navbar">
            <h2>AI Chat & Minigames</h2>
            <button id="logoutBtn" onclick="logout()">Logout</button>
        </nav>

        <div class="main-container">
            <!-- AI Chat Section -->
            <div class="chat-section">
                <div class="chat-header">
                    <h2>AI Assistant</h2>
                </div>
                <div id="chatBox" class="chat-box"></div>
                <div class="chat-input-container">
                    <input type="text" id="chatInput" placeholder="Ask me anything...">
                    <button id="sendBtn" onclick="sendMessage()">Send</button>
                </div>
            </div>

            <!-- Minigames Section -->
            <div class="minigames-section">
                <h2>Minigames</h2>
                <div id="minigamesContainer" class="minigames-grid"></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
